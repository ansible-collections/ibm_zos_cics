name: Ansible sanity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    name: Sanity (ansible-core ${{ matrix.ansible-core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible-core: ["2.16", "2.17", "2.18"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ansible_collections/ibm/ibm_zos_cics

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: python -m pip install "ansible-core~=${{ matrix.ansible-core }}.0"

      - name: Install collection dependencies
        run: ansible-galaxy collection install "ibm.ibm_zos_core:>=1.0.0,<2.0.0" -p .

      - name: Run ansible-test sanity
        working-directory: ansible_collections/ibm/ibm_zos_cics
        run: ansible-test sanity --python 3.12 --requirements
