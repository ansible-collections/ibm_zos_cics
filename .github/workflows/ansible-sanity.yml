name: Ansible sanity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    name: Sanity (ansible-core ${{ matrix.ansible-core }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ansible-core: "2.16", python-version: "3.12" }
          - { ansible-core: "2.17", python-version: "3.12" }
          - { ansible-core: "2.18", python-version: "3.12" }
          - { ansible-core: "2.18", python-version: "3.13" }
          - { ansible-core: "2.19", python-version: "3.12" }
          - { ansible-core: "2.19", python-version: "3.13" }
          - { ansible-core: "2.20", python-version: "3.12" }
          - { ansible-core: "2.20", python-version: "3.14" }
          - { ansible-core: "2.21", python-version: "3.12" }
          - { ansible-core: "2.21", python-version: "3.14" }
          - { ansible-core: "2.22", python-version: "3.13" }
          - { ansible-core: "2.22", python-version: "3.14" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ansible_collections/ibm/ibm_zos_cics

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ansible-core
        run: python -m pip install "ansible-core~=${{ matrix.ansible-core }}.0"

      - name: Install collection dependencies
        run: ansible-galaxy collection install "ibm.ibm_zos_core:>=1.0.0,<2.0.0" -p .

      - name: Run ansible-test sanity
        working-directory: ansible_collections/ibm/ibm_zos_cics
        run: ansible-test sanity --python ${{ matrix.python-version }} --requirements
