name: Weekly smoke test (latest ansible-core)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    name: Sanity (latest ansible-core, Python ${{ matrix.python-version }}, zos_core ${{ matrix.zos-core-label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.13", zos-core-label: "1.x", zos-core: "ibm.ibm_zos_core:>=1.0.0,<2.0.0" }
          - { python-version: "3.13", zos-core-label: "latest", zos-core: "ibm.ibm_zos_core" }
          - { python-version: "3.14", zos-core-label: "1.x", zos-core: "ibm.ibm_zos_core:>=1.0.0,<2.0.0" }
          - { python-version: "3.14", zos-core-label: "latest", zos-core: "ibm.ibm_zos_core" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ansible_collections/ibm/ibm_zos_cics

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install latest ansible-core
        run: python -m pip install --upgrade ansible-core

      - name: Install collection dependencies
        run: ansible-galaxy collection install "${{ matrix.zos-core }}" -p .

      - name: Run ansible-test sanity
        working-directory: ansible_collections/ibm/ibm_zos_cics
        run: ansible-test sanity --python ${{ matrix.python-version }} --requirements

  units:
    name: Units (latest ansible-core, Python ${{ matrix.python-version }}, zos_core ${{ matrix.zos-core-label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.13", zos-core-label: "1.x", zos-core: "ibm.ibm_zos_core:>=1.0.0,<2.0.0" }
          - { python-version: "3.13", zos-core-label: "latest", zos-core: "ibm.ibm_zos_core" }
          - { python-version: "3.14", zos-core-label: "1.x", zos-core: "ibm.ibm_zos_core:>=1.0.0,<2.0.0" }
          - { python-version: "3.14", zos-core-label: "latest", zos-core: "ibm.ibm_zos_core" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ansible_collections/ibm/ibm_zos_cics

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install latest ansible-core and test dependencies
        run: python -m pip install --upgrade ansible-core pytest pytest-mock pytest-xdist mock xmltodict

      - name: Install collection dependencies
        run: ansible-galaxy collection install "${{ matrix.zos-core }}" -p .

      - name: Run ansible-test units
        working-directory: ansible_collections/ibm/ibm_zos_cics
        run: ansible-test units --python ${{ matrix.python-version }}

  lint:
    name: Lint (latest ansible-core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ansible_collections/ibm/ibm_zos_cics

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install latest ansible-core and ansible-lint
        run: python -m pip install --upgrade ansible-core ansible-lint

      - name: Install collection dependencies outside the workspace
        run: ansible-galaxy collection install "ibm.ibm_zos_core:>=1.0.0,<2.0.0" -p "${{ runner.temp }}/collections"

      - name: Run ansible-lint
        working-directory: ansible_collections/ibm/ibm_zos_cics
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}:${{ runner.temp }}/collections
        run: ansible-lint plugins meta
