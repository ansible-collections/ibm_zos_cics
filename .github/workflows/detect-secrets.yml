name: Detect secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Detect secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets (IBM fork)
        run: python -m pip install "git+https://github.com/ibm/detect-secrets.git@master#egg=detect-secrets"

      - name: Scan tracked files against baseline
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
