name: Ansible lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ansible_collections/ibm/ibm_zos_cics

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-core and ansible-lint
        run: python -m pip install ansible-core ansible-lint

      - name: Install collection dependencies outside the workspace
        run: ansible-galaxy collection install ibm.ibm_zos_core -p "${{ runner.temp }}/collections"

      - name: Run ansible-lint
        working-directory: ansible_collections/ibm/ibm_zos_cics
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}:${{ runner.temp }}/collections
        run: ansible-lint plugins meta
